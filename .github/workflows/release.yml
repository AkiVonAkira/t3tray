name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    name: Reproducible release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
        timeout-minutes: 3
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings
      - name: Check version
        run: test "${GITHUB_REF_NAME}" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - run: bash scripts/build-reproducible.sh
      # GitHub requires Enterprise Cloud for attestations in private repositories.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/t3tray.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/t3tray.exe dist/SHA256SUMS dist/install.ps1 dist/uninstall.ps1 --verify-tag --title "t3tray $GITHUB_REF_NAME" --notes-file CHANGELOG.md
