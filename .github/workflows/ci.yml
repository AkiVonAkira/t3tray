name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Rust checks and Windows build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
        timeout-minutes: 3
      - run: rustup show
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --check
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: Package smoke-test binary
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/t3tray.exe dist/
          cd dist
          sha256sum t3tray.exe > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke
          path: dist/
          if-no-files-found: error
          retention-days: 3
  windows:
    name: Installer and real server
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-smoke
          path: dist/
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: powershell-modules
        with:
          path: .tools
          key: powershell-modules-windows-pester-5.7.1-analyzer-1.24.0
      - name: Fetch PowerShell check dependencies
        if: steps.powershell-modules.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 2
        run: |
          Save-Module Pester -RequiredVersion 5.7.1 -Path ./.tools -Force
          Save-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Path ./.tools -Force
      - name: Check PowerShell 5.1 scripts and installer behavior
        shell: powershell
        run: |
          $env:PSModulePath = "$((Resolve-Path .tools).Path);$env:PSModulePath"
          ./scripts/check.ps1
          ./scripts/cli-smoke.ps1 -ExePath ./dist/t3tray.exe
      - name: Stable install, status, HTTP, stop/start, and uninstall
        shell: powershell
        run: ./scripts/smoke.ps1
      - name: Nightly compatibility check on manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 't3tray-nightly'
          $null = New-Item -ItemType Directory -Force $env:USERPROFILE
          ./scripts/smoke.ps1 -Channel nightly
