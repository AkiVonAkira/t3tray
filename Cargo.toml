[package]
name = "t3tray"
version = "0.2.1"
edition = "2021"
publish = false
description = "Unofficial Windows tray host for the T3 Code service launcher"
license = "MIT"
repository = "https://github.com/AkiVonAkira/t3tray"

[profile.release]
opt-level = "s"
lto = true
strip = true

[features]
# Test-only build for CI; see scripts/smoke.ps1.
fixture-releases = []

[dependencies]
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
png = "0.18.1"
sha2 = "0.11.1"
tray-icon = "0.26.1"
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_Registry"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }
