[package]
name = "t3tray"
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = true
strip = true

[dependencies]
png = "0.18.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = "0.26.1"
ureq = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Environment"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }
